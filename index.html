<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Long Field</title>
    <meta
      name="description"
      content="A small game in silhouette: a rabbit has forty-five seconds to cross a cornfield to its burrow while a nuclear blast rises behind it and pressure waves roll through the crop."
    />

    <!--
      The link-preview card: public/card.png, 1200x630. This is the only page,
      and it sits at the root, so ./card.png resolves against it directly.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="scene">
    <div class="stage">
      <canvas
        id="scene"
        tabindex="0"
        role="application"
        aria-label="The Long Field. A rabbit stands on a trodden track at the edge of a floodlit cornfield, a frayed red ribbon tied to one ear. Arrow keys run and space jumps; on a touch screen hold either half of the screen to run and swipe up to jump. Moving sets off a nuclear detonation on the horizon behind, and forty-five seconds to reach the burrow at the far end of the field. Pressure waves cross the corn: shelter behind a drum, a water tank or a boulder as each one passes, and jump the logs, rocks and broken fences in between. A wave that catches you in the open knocks the rabbit unconscious for several seconds while the clock keeps running."
      >
        <p>
          A rabbit crosses a cornfield for its burrow while a nuclear blast
          rises on the horizon behind it and shockwaves roll through the corn.
          This is drawn with canvas, which your browser does not appear to
          support.
        </p>
      </canvas>
      <!--
        One page, so the navigation landmark is a skip link to the game itself
        rather than a menu of somewhere else to go. It is the only thing on this
        page a keyboard user needs to get to.
      -->
      <nav aria-label="Primary"><a href="#scene">Skip to the game</a></nav>
      <h1>The Long Field</h1>
    </div>
    <script type="module" src="./scene.ts"></script>
  </body>
</html>
